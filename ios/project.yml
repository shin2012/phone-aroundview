name: AroundView
options:
  bundleIdPrefix: kr.b-612
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  AroundView:
    type: application
    platform: iOS
    sources:
      - path: AroundView
        excludes: ["Assets3D", "Assets3D/**", "RoadMarks", "RoadMarks/**"]
      # 3D 모델·노면 표시 그림은 폴더째 번들에 복사 (Bundle.main.url(..., subdirectory:))
      - path: AroundView/Assets3D
        type: folder
        buildPhase: resources
      - path: AroundView/RoadMarks
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.aroundview
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 폰어라운드
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 앞 카메라 영상으로 차 주변 노면과 물체를 그리기 위해 카메라를 사용합니다.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: GPS 속도로 화면 계산(카메라 위치 추적)이 맞는지 확인하고, 주행 기록에 위치·속도를 함께 저장합니다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AroundView:
    build:
      targets:
        AroundView: all
